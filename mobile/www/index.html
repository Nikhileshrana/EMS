<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>EMS</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
        background: #0a0a0a;
        color: #f5f5f5;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        max-width: 28rem;
        line-height: 1.5;
        color: #a3a3a3;
        font-size: 0.95rem;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85em;
        color: #e5e5e5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>EMS</h1>
      <p>
        Native shell is ready. Set <code>CAPACITOR_SERVER_URL</code> to your Next.js
        origin, then run <code>bun run cap:sync</code> and open iOS/Android.
      </p>
    </main>
  </body>
</html>
